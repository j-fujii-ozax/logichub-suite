<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Inter-Hub Transfer Optimizer v1.0 - LogicHub</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <py-config>
        packages = ["pandas", "numpy", "matplotlib"]
    </py-config>
    <style>
        :root { --primary: #2c3e50; --accent: #8e44ad; --bg: #f4f7f6; --success: #27ae60; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 0; }
        
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .spinner { width: 50px; height: 50px; border: 5px solid #ddd; border-top: 5px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .container { max-width: 1400px; margin: 40px auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); position: relative; }
        .home-btn { position: absolute; top: 30px; left: 40px; text-decoration: none; color: #5f6368; font-weight: bold; border: 1px solid #ddd; padding: 8px 15px; border-radius: 8px; background: white; }
        
        header { text-align: center; border-bottom: 2px solid #eee; padding-bottom: 20px; margin-bottom: 30px; }
        h1 { color: var(--primary); font-size: 26px; }

        .config-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 30px; }
        .card { background: #f8f9fa; border: 1px solid #dadce0; border-radius: 12px; padding: 25px; display: flex; flex-direction: column; gap: 15px; }
        label { font-weight: bold; font-size: 14px; color: #34495e; }
        input[type="file"], input[type="number"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; }

        .btn-exec { background: var(--accent); color: white; border: none; padding: 18px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; font-size: 18px; transition: 0.3s; box-shadow: 0 4px 15px rgba(142, 68, 173, 0.3); }
        .btn-exec:hover { background: #7d3c98; transform: translateY(-2px); }

        .result-section { margin-top: 40px; }
        .transfer-route-card { border: 1px solid #e0e0e0; border-radius: 12px; margin-bottom: 20px; overflow: hidden; background: white; }
        .route-header { background: #34495e; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .route-body { padding: 20px; }
        
        .truck-viz { height: 12px; background: #eee; border-radius: 6px; position: relative; margin: 15px 0; overflow: hidden; }
        .truck-fill { height: 100%; background: var(--success); transition: width 0.5s; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th { background: #f1f3f4; color: #5f6368; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #f1f3f4; }
        .summary-box { display: flex; gap: 20px; margin-bottom: 30px; }
        .stat-card { flex: 1; padding: 20px; border-radius: 10px; background: #ebf5fb; border-left: 5px solid #3498db; }
        .stat-val { font-size: 24px; font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>

<div id="loading-overlay"><div class="spinner"></div><p id="status-text" style="margin-top:20px; font-weight:bold;">最適化エンジン起動中...</p></div>

<div class="container">
    <a href="index.html" class="home-btn">🏠 Home</a>
    <header><h1>🚚 Inter-Hub Transfer Optimizer v1.0</h1></header>

    <div class="config-grid">
        <div class="card">
            <label>1. 在庫・需要ステータスCSV</label>
            <input type="file" id="upload-stock" accept=".csv">
            <div style="font-size:11px; color:#666;">必須列: 拠点名, 商品名, 在庫数, 需要予測, 安全在庫</div>
        </div>
        <div class="card">
            <label>2. 拠点間コスト・リードタイムマスタCSV</label>
            <input type="file" id="upload-cost" accept=".csv">
            <div style="font-size:11px; color:#666;">必須列: 出発拠点, 到着拠点, 輸送単価, リードタイム</div>
        </div>
        <div class="card">
            <label>3. トラック積載設定 (1台あたり)</label>
            <div style="display:flex; gap:10px;">
                <div style="flex:1;"><label style="font-size:11px;">最大ケース数</label><input type="number" id="truck-cap" value="1000"></div>
                <div style="flex:1;"><label style="font-size:11px;">固定配送料(円)</label><input type="number" id="truck-base-cost" value="50000"></div>
            </div>
        </div>
        <div style="display:flex; align-items: flex-end;">
            <button id="run-btn" class="btn-exec">⚡ 移管最適化シミュレーションを実行</button>
        </div>
    </div>

    <div id="summary-area" class="summary-box"></div>
    <div id="output-area" class="result-section"></div>
</div>

<script type="py">
import pandas as pd
import numpy as np
import io, math, asyncio
from pyscript import when, document
import js

js.document.getElementById("loading-overlay").style.display = "none"

@when("click", "#run-btn")
async def optimize(event):
    overlay = js.document.getElementById("loading-overlay")
    js.document.getElementById("status-text").innerText = "拠点間マッチング計算中..."
    overlay.style.display = "flex"
    await asyncio.sleep(0.1)
    
    try:
        f_s = document.getElementById("upload-stock").files
        f_c = document.getElementById("upload-cost").files
        if len(f_s) == 0 or len(f_c) == 0:
            js.alert("在庫データとコストマスタの両方をアップロードしてください。")
            return
            
        cap = int(document.getElementById("truck-cap").value)
        base_cost = int(document.getElementById("truck-base-cost").value)

        # データ読み込み
        df_stock = pd.read_csv(io.StringIO((await f_s.item(0).text()).replace('\ufeff','')))
        df_cost = pd.read_csv(io.StringIO((await f_c.item(0).text()).replace('\ufeff','')))

        # 1. 拠点・商品ごとの過不足計算
        # Net = 在庫 - (需要 + 安全在庫)
        df_stock['Net'] = df_stock['在庫数'] - (df_stock['需要予測'] + df_stock['安全在庫'])
        
        surplus = df_stock[df_stock['Net'] > 0].copy()
        deficit = df_stock[df_stock['Net'] < 0].copy()
        deficit['Net'] = deficit['Net'].abs() # 正の数に変換

        # 2. マッチングアルゴリズム (Greedy近隣マッチング)
        transfers = []
        
        # 不足している拠点を深刻な順にループ
        for idx_d, row_d in deficit.sort_values('Net', ascending=False).iterrows():
            needed = row_d['Net']
            item = row_d['商品名']
            to_hub = row_d['拠点名']
            
            # この拠点への輸送コストが安い順に余剰拠点をリストアップ
            possible_sources = df_cost[df_cost['到着拠点'] == to_hub].sort_values('輸送単価')
            
            for _, row_c in possible_sources.iterrows():
                from_hub = row_c['出発拠点']
                # その拠点に同じ商品があるか
                src_stock = surplus[(surplus['拠点名'] == from_hub) & (surplus['商品名'] == item)]
                
                if not src_stock.empty and needed > 0:
                    avail = src_stock['Net'].values[0]
                    transfer_qty = min(needed, avail)
                    
                    if transfer_qty > 0:
                        transfers.append({
                            'From': from_hub, 'To': to_hub, 'Item': item, 
                            'Qty': int(transfer_qty), 'UnitCost': row_c['輸送単価'],
                            'LT': row_c['リードタイム']
                        })
                        # 在庫状態を更新
                        needed -= transfer_qty
                        surplus.loc[src_stock.index, 'Net'] -= transfer_qty
        
        df_trans = pd.DataFrame(transfers)
        if df_trans.empty:
            js.document.getElementById("output-area").innerHTML = "<p>移管が必要な拠点間需要は見つかりませんでした。</p>"
            return

        # 3. 集計と表示
        # ルート（From-To）ごとに集計
        summary_html = ""
        total_qty = df_trans['Qty'].sum()
        total_cost = 0
        
        output_div = js.document.getElementById("output-area")
        output_div.innerHTML = "<h2>🚛 最適移管ルート案</h2>"
        
        for (f_h, t_h), df_route in df_trans.groupby(['From', 'To']):
            route_qty = df_route['Qty'].sum()
            trucks = math.ceil(route_qty / cap)
            load_factor = (route_qty % cap) / cap if route_qty % cap != 0 else 1.0
            if trucks > 1: load_factor = 1.0 # 1台以上なら基本満載便がある
            
            route_cost = (trucks * base_cost) + (df_route['Qty'] * df_route['UnitCost']).sum()
            total_cost += route_cost
            
            html = f"""
            <div class="transfer-route-card">
                <div class="route-header">
                    <span>{f_h} ➔ {t_h}</span>
                    <span>計 {route_qty:,} ケース ／ {trucks} 台手配</span>
                </div>
                <div class="route-body">
                    <div style="display:flex; justify-content:space-between; font-size:12px; color:#666;">
                        <span>積載効率（最終便）</span>
                        <span>推定コスト: {int(route_cost):,} 円</span>
                    </div>
                    <div class="truck-viz"><div class="truck-fill" style="width:{int(load_factor*100)}%;"></div></div>
                    <table>
                        <thead><tr><th>商品名</th><th>数量</th><th>リードタイム</th></tr></thead>
                        <tbody>
            """
            for _, r in df_route.iterrows():
                html += f"<tr><td>{r['Item']}</td><td>{r['Qty']:,}</td><td>{r['LT']}日</td></tr>"
            html += "</tbody></table></div></div>"
            output_div.innerHTML += html

        # サマリー
        js.document.getElementById("summary-area").innerHTML = f"""
            <div class="stat-card"><div style="font-size:12px;">総移管数量</div><div class="stat-val">{total_qty:,} <span style="font-size:14px;">ケース</span></div></div>
            <div class="stat-card" style="border-left-color:#8e44ad;"><div style="font-size:12px;">総輸送コスト(概算)</div><div class="stat-val">{int(total_cost):,} <span style="font-size:14px;">円</span></div></div>
            <div class="stat-card" style="border-left-color:#27ae60;"><div style="font-size:12px;">解消された欠品リスク</div><div class="stat-val">{len(df_trans['Item'].unique())} <span style="font-size:14px;">SKU</span></div></div>
        """

    except Exception as e:
        js.alert(f"最適化計算中にエラーが発生しました: {str(e)}")
    finally:
        overlay.style.display = "none"

</script>
</body>
</html>
