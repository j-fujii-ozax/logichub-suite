<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>親商品実績データ生成ツール (CSV安定版)</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 40px; background-color: #f4f7f9; color: #333; }
        .container { max-width: 850px; margin: auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .upload-section { margin: 25px 0; padding: 30px; border: 2px dashed #3498db; border-radius: 10px; text-align: center; background: #fdfdfd; }
        .btn { background: #3498db; color: white; padding: 14px 28px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn:hover { background: #2980b9; }
        .btn:disabled { background: #bdc3c7; cursor: not-allowed; }
        #status-container { margin-top: 20px; min-height: 50px; }
        .progress-info { color: #2980b9; font-weight: bold; }
        .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid rgba(52,152,219,.3); border-radius: 50%; border-top-color: #3498db; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-msg { color: #c0392b; background: #f9ebea; padding: 15px; border-radius: 5px; }
        .instructions { font-size: 0.9em; color: #7f8c8d; background: #f8f9fa; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>在庫実績データ生成 (CSV安定版)</h1>
    <div class="instructions">
        <p><strong>【仕様】</strong></p>
        <ul>
            <li><strong>在庫マイナス防止:</strong> 在庫が0を下回らないよう、出荷数を在庫がある日に自動調整します。</li>
            <li><strong>安定性:</strong> 大量データでも画面が固まらないよう、非同期で1件ずつ処理します。</li>
            <li><strong>出力:</strong> Excelでそのまま開けるBOM付きCSV形式で出力します。</li>
        </ul>
    </div>

    <div class="upload-section">
        <input type="file" id="file-upload" accept=".xlsx">
        <button id="process-btn" class="btn">解析・CSV出力</button>
    </div>

    <div id="status-container">
        <div id="status">PyScriptを読み込んでいます...</div>
    </div>
    <div id="download-area" style="text-align:center; margin-top:20px;"></div>
</div>

<py-config>
    packages = ["pandas", "openpyxl", "numpy"]
</py-config>

<script type="py">
import pandas as pd
import numpy as np
import io
import asyncio
from pyscript import document, window

async def process_file(event):
    status = document.getElementById("status")
    download_area = document.getElementById("download-area")
    btn = document.getElementById("process-btn")
    
    file_input = document.getElementById("file-upload")
    if not file_input.files:
        status.innerText = "ファイルを選択してください。"
        return

    btn.disabled = True
    download_area.innerHTML = ""
    
    file = file_input.files.item(0)
    array_buffer = await file.arrayBuffer()
    data = array_buffer.to_py()
    
    try:
        status.innerHTML = '<div class="spinner"></div><span class="progress-info">データを読み込み中...</span>'
        await asyncio.sleep(0.05)
        
        # Excel読み込み
        df_dict = pd.read_excel(io.BytesIO(data), sheet_name=None)
        
        # --- 1. 出荷データクリーニング ---
        df_ship_raw = df_dict.get('出荷データ（販売実績)')
        h_idx = df_ship_raw[df_ship_raw.apply(lambda r: r.astype(str).str.contains('親商品コード').any(), axis=1)].index[0]
        df_ship = df_ship_raw.iloc[h_idx+1:].copy()
        df_ship.columns = [str(c).strip() for c in df_ship_raw.iloc[h_idx]]
        date_cols = [c for c in df_ship.columns if '-' in str(c) or isinstance(c, pd.Timestamp)]
        df_ship_long = df_ship.melt(id_vars=['親商品コード'], value_vars=date_cols, var_name='Month', value_name='Shipment')
        df_ship_long['Month'] = pd.to_datetime(df_ship_long['Month'])
        df_ship_long['Shipment'] = pd.to_numeric(df_ship_long['Shipment'], errors='coerce').fillna(0)
        ship_monthly = df_ship_long.groupby(['親商品コード', 'Month'])['Shipment'].sum().reset_index()

        # --- 2. 入荷データクリーニング ---
        df_arr_raw = df_dict.get('入荷データ（裁断量)')
        h_idx_arr = df_arr_raw[df_arr_raw.apply(lambda r: r.astype(str).str.contains('親商品コード').any(), axis=1)].index[0]
        cols_arr = df_arr_raw.iloc[h_idx_arr].tolist()
        code_idx_a = [i for i, c in enumerate(cols_arr) if '親商品コード' in str(c)][0]
        date_idx_a = [i for i, c in enumerate(cols_arr) if '日' in str(c)][-1]
        amount_idx_a = [i for i, c in enumerate(cols_arr) if '量' in str(c)][0]
        
        arr_list = []
        for _, row in df_arr_raw.iloc[h_idx_arr+1:].iterrows():
            d_str = str(row.iloc[date_idx_a])[:8]
            if len(d_str) == 8 and d_str.isdigit():
                arr_list.append({
                    '親商品コード': str(row.iloc[code_idx_a]),
                    'Date': pd.to_datetime(d_str, format='%Y%m%d', errors='coerce'),
                    'Arrival': pd.to_numeric(row.iloc[amount_idx_a], errors='coerce')
                })
        arrival_daily = pd.DataFrame(arr_list).dropna(subset=['Date'])
        arrival_daily = arrival_daily.groupby(['親商品コード', 'Date'])['Arrival'].sum().reset_index()

        # --- 3. 在庫データクリーニング ---
        df_inv_raw = df_dict.get('在庫データ（製品在庫)')
        h_idx_inv = df_inv_raw[df_inv_raw.apply(lambda r: r.astype(str).str.contains('親商品コード').any(), axis=1)].index[0]
        ship_months = sorted(ship_monthly['Month'].unique())
        inv_list = []
        for _, row in df_inv_raw.iloc[h_idx_inv+1:].iterrows():
            code = str(row.iloc[0])
            if code == 'nan': continue
            for i, m in enumerate(ship_months):
                if i+2 < len(row):
                    val = pd.to_numeric(row.iloc[i+2], errors='coerce')
                    inv_list.append({'親商品コード': code, 'Month': m, 'Inventory_EOM': val})
        inventory_monthly = pd.DataFrame(inv_list)

        # --- 4. 計算メインループ ---
        all_codes = sorted(ship_monthly['親商品コード'].unique())
        total_items = len(all_codes)
        results = []
        
        for idx, code in enumerate(all_codes):
            code_str = str(code)
            # 5件ごとに画面更新
            if idx % 5 == 0:
                status.innerHTML = f'<div class="spinner"></div><span class="progress-info">作成中: {idx}/{total_items} (商品: {code_str})</span>'
                await asyncio.sleep(0.01)

            item_ship = ship_monthly[ship_monthly['親商品コード'] == code]
            item_arr = arrival_daily[arrival_daily['親商品コード'] == code_str]
            item_inv = inventory_monthly[inventory_monthly['親商品コード'] == code_str]
            
            # 初期在庫推定
            m1 = ship_months[0]
            m1_inv_eom = item_inv[item_inv['Month'] == m1]['Inventory_EOM'].iloc[0] if not item_inv[item_inv['Month'] == m1].empty else 0
            m1_arr_sum = item_arr[item_arr['Date'].dt.to_period('M') == pd.Period(m1, freq='M')]['Arrival'].sum()
            m1_ship_sum = item_ship[item_ship['Month'] == m1]['Shipment'].sum()
            curr_stock = max(0, (m1_inv_eom if not pd.isna(m1_inv_eom) else 0) - m1_arr_sum + m1_ship_sum)
            
            for m in ship_months:
                m_end = m + pd.offsets.MonthEnd(0)
                m_dates = pd.date_range(m, m_end)
                m_arr_dict = item_arr[(item_arr['Date'] >= m) & (item_arr['Date'] <= m_end)].set_index('Date')['Arrival'].to_dict()
                
                m_inv_target = item_inv[item_inv['Month'] == m]['Inventory_EOM'].iloc[0] if not item_inv[item_inv['Month'] == m].empty else np.nan
                
                if not pd.isna(m_inv_target):
                    m_ship_total = curr_stock + sum(m_arr_dict.values()) - m_inv_target
                else:
                    m_ship_total = item_ship[item_ship['Month'] == m]['Shipment'].sum()
                
                m_ship_total = max(0, m_ship_total)
                remaining_ship = m_ship_total
                days_count = len(m_dates)
                
                for i, d in enumerate(m_dates):
                    arr_val = m_arr_dict.get(d, 0)
                    # 目標の1日出荷数（最終日は残りを全投入）
                    target_d_ship = remaining_ship if i == days_count - 1 else m_ship_total / days_count
                    
                    # 在庫マイナス防止: (前日在庫 + 当日入荷) を上限とする
                    actual_d_ship = min(target_d_ship, curr_stock + arr_val)
                    
                    new_stock = curr_stock + arr_val - actual_d_ship
                    results.append({
                        '日付': d.strftime('%Y-%m-%d'),
                        '親商品コード': code,
                        '在庫数': round(new_stock, 2),
                        '出荷数': round(actual_d_ship, 2),
                        '入荷数': round(arr_val, 2)
                    })
                    curr_stock = new_stock
                    remaining_ship -= actual_d_ship

        # CSV出力
        status.innerHTML = '<div class="spinner"></div><span class="progress-info">CSVを生成しています...</span>'
        await asyncio.sleep(0.05)
        
        final_df = pd.DataFrame(results)
        csv_buffer = io.StringIO()
        # Excel対応のためBOM(utf-8-sig)を付与
        final_df.to_csv(csv_buffer, index=False, encoding='utf-8-sig')
        
        blob = window.Blob.new([csv_buffer.getvalue()], { "type": "text/csv" })
        url = window.URL.createObjectURL(blob)
        
        download_area.innerHTML = f'<a href="{url}" download="親商品在庫実績.csv" class="btn" style="background:#27ae60;">CSVをダウンロード</a>'
        status.innerText = "作成が完了しました。"
        btn.disabled = False
        
    except Exception as e:
        status.innerHTML = f'<div class="error-msg">エラー: {str(e)}</div>'
        btn.disabled = False
        print(e)

document.getElementById("process-btn").onclick = process_file
document.getElementById("status").innerText = "準備完了。"
</script>

</body>
</html>
