<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Seasonal Supply Optimizer v1.0 - LogicHub</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <py-config>packages = ["pandas", "numpy"]</py-config>
    <style>
        :root { --primary: #2c3e50; --accent: #e67e22; --bg: #f4f7f6; --danger: #d93025; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 0; }
        
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .spinner { width: 50px; height: 50px; border: 5px solid #ddd; border-top: 5px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .container { max-width: 1300px; margin: 40px auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); position: relative; }
        .home-btn { position: absolute; top: 30px; left: 40px; text-decoration: none; color: #5f6368; font-weight: bold; border: 1px solid #ddd; padding: 8px 15px; border-radius: 8px; background: white; }
        
        header { text-align: center; border-bottom: 2px solid #eee; padding-bottom: 20px; margin-bottom: 30px; }
        h1 { color: var(--primary); font-size: 26px; }

        .config-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .card { background: #f8f9fa; border: 1px solid #dadce0; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        label { font-weight: bold; font-size: 14px; color: #34495e; }
        
        .caution-panel { background: #fff3e0; border: 1px solid #ffe0b2; padding: 20px; border-radius: 12px; margin-bottom: 30px; }
        .input-row { display: flex; gap: 20px; align-items: center; margin-top: 10px; }
        
        .btn-exec { background: var(--accent); color: white; border: none; padding: 18px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(230,126,34,0.3); }
        
        .alert-banner { background: #d93025; color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        th { background: #34495e; color: white; padding: 12px; font-size: 12px; }
        td { padding: 10px; border-bottom: 1px solid #eee; text-align: center; font-size: 14px; }
        .shift-highlight { background: #fffde7; font-weight: bold; color: #e67e22; }
    </style>
</head>
<body>

<div id="loading-overlay"><div class="spinner"></div><p id="status-text" style="margin-top:20px; font-weight:bold;">準備中...</p></div>

<div class="container">
    <a href="index.html" class="home-btn">🏠 Home</a>
    <header><h1>☀️ Seasonal Supply Optimizer v1.0</h1></header>

    <div class="config-grid">
        <div class="card">
            <label>1. 予測結果CSV</label>
            <input type="file" id="upload-predict" accept=".csv">
        </div>
        <div class="card">
            <label>2. 商品マスタCSV (記憶済み)</label>
            <input type="file" id="upload-master" accept=".csv">
            <span id="master-status" style="font-size:11px; color:green;"></span>
        </div>
        <div class="card">
            <label>3. 取引先マスタCSV (記憶済み)</label>
            <input type="file" id="upload-supplier" accept=".csv">
            <span id="supplier-status" style="font-size:11px; color:green;"></span>
        </div>
    </div>

    <div class="caution-panel">
        <label>🛠️ 注意期間（連休）の設定</label>
        <div class="input-row">
            <span>期間開始:</span><input type="date" id="holiday-start" value="2025-08-13">
            <span>期間終了:</span><input type="date" id="holiday-end" value="2025-08-17">
            <span>先行手配日（連休前最終出荷日）:</span><input type="date" id="ship-date" value="2025-08-12">
        </div>
        <p style="font-size:12px; color:#e67e22; margin-top:10px;">※期間中の需要をすべて合計し、先行手配日にまとめます。</p>
    </div>

    <button id="run-btn" class="btn-exec">⚡ 連休前の先行手配量を計算する</button>

    <div id="output-area"></div>
</div>

<script type="py">
import pandas as pd
import io, math, asyncio
from datetime import datetime
from pyscript import when, document
import js

js.document.getElementById("loading-overlay").style.display = "none"

# LocalStorageからマスタを復元する機能（簡易版）
def get_stored_csv(key):
    return js.localStorage.getItem(key)

def save_stored_csv(key, content):
    js.localStorage.setItem(key, content)

@when("click", "#run-btn")
async def process(event):
    overlay = js.document.getElementById("loading-overlay")
    js.document.getElementById("status-text").innerText = "連休需要を集計中..."
    overlay.style.display = "flex"
    await asyncio.sleep(0.1)
    
    try:
        # ファイル取得（アップロードがあれば優先、なければ保存済みを使用）
        f_p = document.getElementById("upload-predict").files
        f_m = document.getElementById("upload-master").files
        f_s = document.getElementById("upload-supplier").files
        
        if len(f_p) == 0:
            js.alert("予測結果CSVを選択してください。")
            return
            
        predict_text = await f_p.item(0).text()
        
        # マスタの読み込みロジック
        if len(f_m) > 0:
            master_text = await f_m.item(0).text()
            save_stored_csv("master_csv", master_text)
        else:
            master_text = get_stored_csv("master_csv")
            
        if len(f_s) > 0:
            supp_text = await f_s.item(0).text()
            save_stored_csv("supp_csv", supp_text)
        else:
            supp_text = get_stored_csv("supp_csv")

        if not master_text or not supp_text:
            js.alert("マスタデータがありません。初回はマスタをアップロードしてください。")
            return

        # パラメータ取得
        h_start = pd.to_datetime(document.getElementById("holiday-start").value)
        h_end = pd.to_datetime(document.getElementById("holiday-end").value)
        ship_target = pd.to_datetime(document.getElementById("ship-date").value)

        # データ処理
        df_p = pd.read_csv(io.StringIO(predict_text))
        df_m = pd.read_csv(io.StringIO(master_text))
        df_p['日付'] = pd.to_datetime(df_p['日付'])

        # 連休期間のデータを抽出
        mask = (df_p['日付'] >= h_start) & (df_p['日付'] <= h_end)
        df_holiday = df_p[mask].copy()
        
        # 商品ごとに連休合計を計算
        df_sum = df_holiday.groupby('商品コード')['発注数'].sum().reset_index()
        df_sum.rename(columns={'発注数': '連休中需要合計'}, inplace=True)

        # マスタ結合して表示用データ作成
        df_res = pd.merge(df_sum, df_m[['ユーザー商品コード', '商品名', '取引先名']], left_on='商品コード', right_on='ユーザー商品コード', how='left')
        df_res = df_res[df_res['連休中需要合計'] > 0]

        output_div = js.document.getElementById("output-area")
        
        if df_res.empty:
            output_div.innerHTML = "<div class='card'>指定期間中に需要（発注予定）はありませんでした。</div>"
        else:
            alert_html = f"""
            <div class="alert-banner">🚨 注意：{h_start.strftime('%m/%d')}〜{h_end.strftime('%m/%d')} はサプライヤー休業期間です。</div>
            <div class="card">
                <p>以下の <strong>{len(df_res)}</strong> 品目は、連休前の <strong>{ship_target.strftime('%Y/%m/%d')}</strong> にまとめて手配することを推奨します。</p>
                <table>
                    <thead><tr><th>取引先名</th><th>商品名</th><th>連休中の総需要</th><th>推奨手配日</th><th>手配量案</th></tr></thead>
                    <tbody>
            """
            for _, row in df_res.iterrows():
                alert_html += f"""
                <tr>
                    <td>{row['取引先名']}</td>
                    <td style="text-align:left;">{row['商品名']}</td>
                    <td>{int(row['連休中需要合計'])}</td>
                    <td class="shift-highlight">{ship_target.strftime('%m/%d')}</td>
                    <td class="shift-highlight">{int(row['連休中需要合計'])}</td>
                </tr>
                """
            alert_html += "</tbody></table></div>"
            output_div.innerHTML = alert_html

    except Exception as e:
        js.alert(f"計算エラー: {str(e)}")
    finally:
        overlay.style.display = "none"

# 起動時にマスタの状態を確認
m_status = "登録済み" if get_stored_csv("master_csv") else "未登録"
s_status = "登録済み" if get_stored_csv("supp_csv") else "未登録"
js.document.getElementById("master-status").innerText = f"現在：{m_status}"
js.document.getElementById("supplier-status").innerText = f"現在：{s_status}"

</script>
</body>
</html>
