<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原材料在庫実績生成ツール (安定版)</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 40px; background-color: #f0f4f8; color: #333; }
        .container { max-width: 900px; margin: auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 10px; margin-bottom: 20px; }
        .upload-section { margin: 25px 0; padding: 30px; border: 2px dashed #3498db; border-radius: 10px; text-align: center; background: #fafafa; }
        .btn { background: #3498db; color: white; padding: 14px 28px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn:hover { background: #2980b9; }
        .btn:disabled { background: #bdc3c7; cursor: not-allowed; }
        #status-container { margin-top: 20px; min-height: 60px; }
        .progress-info { color: #2980b9; font-weight: bold; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(52,152,219,.3); border-radius: 50%; border-top-color: #3498db; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .instructions { font-size: 0.9em; color: #666; background: #eef2f7; padding: 15px; border-radius: 5px; margin-bottom: 20px; line-height: 1.6; }
        .error-msg { color: #c0392b; background: #f9ebea; padding: 15px; border-radius: 5px; border: 1px solid #fadbd8; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>原材料在庫実績生成ツール</h1>
    <div class="instructions">
        <p><strong>【本ツールの仕様】</strong></p>
        <ul>
            <li><strong>対象項目:</strong> 「ユーザー商品コード」をキーとし、入荷は「購入重量(kg)」を使用します。</li>
            <li><strong>日付形式:</strong> 横並びの「2025年4月」といった形式を自動解析します。</li>
            <li><strong>在庫マイナス防止:</strong> 在庫が0を下回らないよう、出荷（使用量）を在庫がある日に自動で寄せます。</li>
            <li><strong>帳尻合わせ:</strong> 月末在庫の数値と整合するように、月間の合計出荷量を調整します。</li>
        </ul>
    </div>

    <div class="upload-section">
        <input type="file" id="file-upload" accept=".xlsx">
        <button id="process-btn" class="btn">解析・CSV出力</button>
    </div>

    <div id="status-container">
        <div id="status">PyScriptを準備しています...</div>
    </div>
    <div id="download-area" style="text-align:center;"></div>
</div>

<py-config>
    packages = ["pandas", "openpyxl", "numpy"]
</py-config>

<script type="py">
import pandas as pd
import numpy as np
import io
import asyncio
import re
from pyscript import document, window

def parse_japanese_date(date_str):
    """'2025年4月' 形式の文字列を Timestamp に変換"""
    try:
        match = re.match(r'(\d+)年(\d+)月', str(date_str))
        if match:
            return pd.Timestamp(year=int(match.group(1)), month=int(match.group(2)), day=1)
    except:
        pass
    return pd.to_datetime(date_str, errors='coerce')

async def process_file(event):
    status = document.getElementById("status")
    download_area = document.getElementById("download-area")
    btn = document.getElementById("process-btn")
    
    file_input = document.getElementById("file-upload")
    if not file_input.files:
        status.innerText = "ファイルを選択してください。"
        return

    btn.disabled = True
    download_area.innerHTML = ""
    
    file = file_input.files.item(0)
    array_buffer = await file.arrayBuffer()
    data = array_buffer.to_py()
    
    try:
        status.innerHTML = '<div class="spinner"></div><span class="progress-info">Excelファイルを読み込み中...</span>'
        await asyncio.sleep(0.1)
        
        df_dict = pd.read_excel(io.BytesIO(data), sheet_name=None)
        
        # --- 1. 出荷データ (使用量) ---
        df_ship_raw = df_dict.get('出荷データ（使用量）')
        if df_ship_raw is None: raise ValueError("シート「出荷データ（使用量）」が見つかりません。")
        
        # '20XX年X月' の列を探す
        date_cols = [c for c in df_ship_raw.columns if '年' in str(c) and '月' in str(c)]
        df_ship_long = df_ship_raw.melt(id_vars=['ユーザー商品コード'], value_vars=date_cols, var_name='RawMonth', value_name='Shipment')
        df_ship_long['Month'] = df_ship_long['RawMonth'].apply(parse_japanese_date)
        df_ship_long = df_ship_long.dropna(subset=['Month'])
        df_ship_long['Shipment'] = pd.to_numeric(df_ship_long['Shipment'], errors='coerce').fillna(0)
        ship_monthly = df_ship_long.groupby(['ユーザー商品コード', 'Month'])['Shipment'].sum().reset_index()

        # --- 2. 入荷データ (購入) ---
        df_arr_raw = df_dict.get('入荷データ')
        if df_arr_raw is None: raise ValueError("シート「入荷データ」が見つかりません。")
        
        # 入荷日(YYYYMMDD)と購入重量(kg)を取得
        df_arr = df_arr_raw.copy()
        df_arr['Date'] = pd.to_datetime(df_arr['入荷日'].astype(str), format='%Y%m%d', errors='coerce')
        df_arr['Arrival'] = pd.to_numeric(df_arr['購入重量(kg)'], errors='coerce').fillna(0)
        arrival_daily = df_arr.dropna(subset=['Date']).groupby(['ユーザー商品コード', 'Date'])['Arrival'].sum().reset_index()

        # --- 3. 在庫データ ---
        df_inv_raw = df_dict.get('在庫データ')
        if df_inv_raw is None: raise ValueError("シート「在庫データ」が見つかりません。")
        
        df_inv_long = df_inv_raw.melt(id_vars=['ユーザー商品コード'], value_vars=date_cols, var_name='RawMonth', value_name='Inventory_EOM')
        df_inv_long['Month'] = df_inv_long['RawMonth'].apply(parse_japanese_date)
        df_inv_long = df_inv_long.dropna(subset=['Month'])
        df_inv_long['Inventory_EOM'] = pd.to_numeric(df_inv_long['Inventory_EOM'], errors='coerce')
        inventory_monthly = df_inv_long.groupby(['ユーザー商品コード', 'Month'])['Inventory_EOM'].first().reset_index()

        # --- 4. 計算ロジック ---
        all_codes = sorted(ship_monthly['ユーザー商品コード'].unique())
        ship_months = sorted(ship_monthly['Month'].unique())
        total_items = len(all_codes)
        final_results = []
        
        for idx, code in enumerate(all_codes):
            if idx % 5 == 0:
                status.innerHTML = f'<div class="spinner"></div><span class="progress-info">処理中: {idx}/{total_items}<br>コード: {code}</span>'
                await asyncio.sleep(0.01)

            code_str = str(code)
            item_ship = ship_monthly[ship_monthly['ユーザー商品コード'] == code]
            item_arr = arrival_daily[arrival_daily['ユーザー商品コード'] == code]
            item_inv = inventory_monthly[inventory_monthly['ユーザー商品コード'] == code]
            
            # 初期在庫の推定 (最初の月の開始時)
            m1 = ship_months[0]
            m1_inv_eom = item_inv[item_inv['Month'] == m1]['Inventory_EOM'].iloc[0] if not item_inv[item_inv['Month'] == m1].empty else 0
            m1_arr_sum = item_arr[item_arr['Date'].dt.to_period('M') == pd.Period(m1, freq='M')]['Arrival'].sum()
            m1_ship_sum = item_ship[item_ship['Month'] == m1]['Shipment'].sum()
            
            # S_start = S_end - Arr + Ship
            curr_stock = max(0, (m1_inv_eom if not pd.isna(m1_inv_eom) else 0) - m1_arr_sum + m1_ship_sum)
            
            for m in ship_months:
                m_end = m + pd.offsets.MonthEnd(0)
                m_dates = pd.date_range(m, m_end)
                m_arr_dict = item_arr[(item_arr['Date'] >= m) & (item_arr['Date'] <= m_end)].set_index('Date')['Arrival'].to_dict()
                m_inv_target = item_inv[item_inv['Month'] == m]['Inventory_EOM'].iloc[0] if not item_inv[item_inv['Month'] == m].empty else np.nan
                
                # 月間の合計出荷枠を決定
                if not pd.isna(m_inv_target):
                    m_ship_total = curr_stock + sum(m_arr_dict.values()) - m_inv_target
                else:
                    m_ship_total = item_ship[item_ship['Month'] == m]['Shipment'].sum()
                
                m_ship_total = max(0, m_ship_total)
                remaining_ship = m_ship_total
                
                for i, d in enumerate(m_dates):
                    arr_val = m_arr_dict.get(d, 0)
                    
                    # 当日の理想出荷量
                    target_daily = remaining_ship if i == len(m_dates)-1 else m_ship_total / len(m_dates)
                    
                    # 在庫マイナス防止 (前日在庫 + 当日入荷 が上限)
                    actual_ship = min(target_daily, curr_stock + arr_val)
                    
                    new_stock = curr_stock + arr_val - actual_ship
                    final_results.append({
                        '日付': d.strftime('%Y-%m-%d'),
                        'ユーザー商品コード': code,
                        '在庫数': round(new_stock, 3),
                        '出荷数': round(actual_ship, 3),
                        '入荷数': round(arr_val, 3)
                    })
                    curr_stock = new_stock
                    remaining_ship -= actual_ship

        status.innerHTML = '<div class="spinner"></div><span class="progress-info">CSVファイルを生成中...</span>'
        await asyncio.sleep(0.1)
        
        # CSV生成
        output_df = pd.DataFrame(final_results)
        csv_buffer = io.StringIO()
        output_df.to_csv(csv_buffer, index=False, encoding='utf-8-sig')
        
        blob = window.Blob.new([csv_buffer.getvalue()], { "type": "text/csv" })
        url = window.URL.createObjectURL(blob)
        
        download_area.innerHTML = f'<a href="{url}" download="原材料在庫実績.csv" class="btn" style="background:#27ae60;">CSVを保存する</a>'
        status.innerText = "完了しました！"
        btn.disabled = False
        
    except Exception as e:
        status.innerHTML = f'<div class="error-msg">エラー: {str(e)}</div>'
        btn.disabled = False
        print(e)

document.getElementById("process-btn").onclick = process_file
document.getElementById("status").innerText = "準備完了。Excelをアップロードしてください。"
</script>

</body>
</html>
