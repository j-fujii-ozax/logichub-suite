<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Smart Order Optimizer v3.6 - LogicHub</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <py-config>packages = ["pandas", "numpy"]</py-config>
    <style>
        :root { --primary: #1a73e8; --success: #34a853; --danger: #d93025; --neutral: #9aa0a6; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); margin: 0; padding: 0; }
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .spinner { width: 50px; height: 50px; border: 5px solid #ddd; border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .container { max-width: 1300px; margin: 40px auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); position: relative; }
        .home-btn { position: absolute; top: 30px; left: 40px; text-decoration: none; color: #5f6368; font-weight: bold; border: 1px solid #ddd; padding: 8px 15px; border-radius: 8px; background: white; z-index: 100; }
        header { text-align: center; border-bottom: 2px solid #e1e4e8; padding-bottom: 20px; margin-bottom: 30px; }
        h1 { font-size: 26px; color: var(--primary); margin: 0; display: flex; align-items: center; justify-content: center; gap: 10px; }

        /* アップロードセクション: 3カラム横並び */
        .upload-section { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 20px; 
            margin-bottom: 25px; 
        }
        
        /* カード内部: ラベルと入力を縦に並べる */
        .upload-card { 
            background: #f8f9fa; 
            border: 1px solid #dadce0; 
            border-radius: 12px; 
            padding: 20px; 
            display: flex;
            flex-direction: column; 
            gap: 10px;
        }
        
        label { font-weight: 600; font-size: 14px; color: #5f6368; }
        input[type="file"] { font-size: 13px; }

        .btn-exec { background: var(--primary); color: white; border: none; padding: 18px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; margin-bottom: 30px; transition: 0.2s; }
        .btn-exec:hover { background: #174ea6; transform: translateY(-2px); }
        
        .delivery-block { margin-top: 40px; border: 2px solid #ddd; border-radius: 15px; overflow: hidden; background: white; margin-bottom: 40px; }
        .delivery-header { background: #34495e; color: white; padding: 15px 25px; font-weight: bold; font-size: 18px; }
        .supplier-info-bar { background: #f1f3f4; padding: 10px 25px; font-weight: bold; display: flex; justify-content: space-between; border-bottom: 1px solid #eee; }
        
        .alert-box { padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; transition: 0.2s; }
        .alert-success { background-color: #e6f4ea !important; color: #137333 !important; border-left: 10px solid var(--success); }
        .alert-danger { background-color: #fce8e6 !important; color: #d93025 !important; border-left: 10px solid var(--danger); }
        .alert-neutral { background-color: #f1f3f4 !important; color: #5f6368 !important; border-left: 10px solid var(--neutral); }
        
        table { width: 100%; border-collapse: collapse; }
        th { background: #fafafa; padding: 12px; font-size: 11px; color: #70757a; border-bottom: 1px solid #eee; }
        td { padding: 10px; border-bottom: 1px solid #f1f3f4; text-align: center; font-size: 14px; }
        .editable-qty { width: 110px; padding: 8px; border: 2px solid var(--primary); border-radius: 6px; text-align: center; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>
<div id="loading-overlay"><div class="spinner"></div><p id="status-text" style="margin-top:20px; font-weight:bold;">準備中...</p></div>
<div class="container">
    <a href="index.html" class="home-btn">🏠 Home</a>
    <header><h1>📦 Smart Order Optimizer v3.6</h1></header>
    <div class="upload-section">
        <div class="upload-card">
            <label>1. 予測結果CSV</label>
            <input type="file" id="upload-predict" accept=".csv">
        </div>
        <div class="upload-card">
            <label>2. 商品マスタCSV</label>
            <input type="file" id="upload-master" accept=".csv">
        </div>
        <div class="upload-card">
            <label>3. 取引先マスタCSV</label>
            <input type="file" id="upload-supplier" accept=".csv">
        </div>
    </div>
    <button id="run-btn" class="btn-exec">⚡ 配送回別にMOQ最適化を実行</button>
    <div id="output-area"></div>
</div>

<script type="py">
import pandas as pd
import io, math, asyncio
from datetime import datetime
from pyscript import when, document
import js

js.document.getElementById("loading-overlay").style.display = "none"

def smart_read(text):
    text = text.replace('\ufeff', '')
    sep = '\t' if '\t' in text[:1000] else ','
    df = pd.read_csv(io.StringIO(text), sep=sep)
    df.columns = [str(c).strip(' "').strip() for c in df.columns]
    return df

@when("click", "#run-btn")
async def process(event):
    overlay = js.document.getElementById("loading-overlay")
    js.document.getElementById("status-text").innerText = "計算中..."
    overlay.style.display = "flex"
    await asyncio.sleep(0.1)
    
    try:
        f_p, f_m, f_s = document.getElementById("upload-predict").files, document.getElementById("upload-master").files, document.getElementById("upload-supplier").files
        if len(f_p)==0 or len(f_m)==0 or len(f_s)==0: return

        df_p, df_m, df_supp = smart_read(await f_p.item(0).text()), smart_read(await f_m.item(0).text()), smart_read(await f_s.item(0).text())
        df_p['日付'] = pd.to_datetime(df_p['日付'])
        df_p['配送回'] = df_p['日付'].dt.strftime('%Y-%m-%d')

        df_merged = pd.merge(df_p, df_m[['ユーザー商品コード', '取引先コード', '取引先名', '発注ロット']], left_on='商品コード', right_on='ユーザー商品コード', how='left')
        df_all = pd.merge(df_merged, df_supp[['取引先コード', 'MOQ']], on='取引先コード', how='left')
        
        output_div = js.document.getElementById("output-area")
        output_div.innerHTML = ""

        for d_group, df_d in df_all.groupby('配送回', sort=True):
            block_html = f'<div class="delivery-block"><div class="delivery-header">🚚 配送予定日: {d_group}</div>'
            for s_name, df_s in df_d.groupby('取引先名'):
                goal = int(df_s['MOQ'].iloc[0]) if pd.notnull(df_s['MOQ'].iloc[0]) else 0
                df_s['補正後'] = df_s.apply(lambda x: math.ceil(x['発注数']/x['発注ロット'])*x['発注ロット'] if x['発注数']>0 and x['発注ロット']>0 else x['発注数'], axis=1)
                total = int(df_s['補正後'].sum())
                
                safe_s_name = s_name.replace(" ", "_").replace("-", "_")
                block_id = f"ID_{d_group.replace('-','')}_{safe_s_name}"
                
                if total == 0:
                    status_cls, msg_text = "alert-neutral", "⚪ オーダーなし"
                elif total >= goal:
                    status_cls, msg_text = "alert-success", "✅ 条件クリア"
                else:
                    status_cls, msg_text = "alert-danger", f"⚠️ 不足: {goal-total:,}"
                
                block_html += f"""
                <div class="supplier-sub-block">
                    <div class="supplier-info-bar">🏢 {s_name} <span>目標MOQ: <span id="goal-{block_id}">{goal}</span></span></div>
                    <div id="alert-{block_id}" class="alert-box {status_cls}">
                        <span class="msg-text" style="font-weight:bold;">{msg_text}</span>
                        <span>合計: <span id="total-{block_id}" style="font-size:20px; font-weight:bold;">{total}</span></span>
                    </div>
                    <table><thead><tr><th style="text-align:left;">商品名</th><th>予測</th><th>ロット</th><th>発注修正</th></tr></thead><tbody>
                """
                for i, row in df_s.iterrows():
                    block_html += f"""
                    <tr><td style="text-align:left;">{row['商品名称']}</td><td>{row['発注数']}</td><td>{row['発注ロット']}</td>
                    <td><input type="number" class="editable-qty" data-block="{block_id}" value="{int(row['補正後'])}"></td></tr>
                    """
                block_html += "</tbody></table></div>"
            output_div.innerHTML += block_html + "</div>"
    except Exception as e: js.alert(str(e))
    finally: overlay.style.display = "none"

@when("input", "#output-area")
def update(event):
    target = event.target
    if not target.classList.contains("editable-qty"): return
    
    block_id = target.getAttribute("data-block")
    goal = int(js.document.getElementById(f"goal-{block_id}").innerText)
    inputs = js.document.querySelectorAll(f'input[data-block="{block_id}"]')
    total = sum(int(inp.value) if inp.value else 0 for inp in inputs)
    
    js.document.getElementById(f"total-{block_id}").innerText = str(total)
    box = js.document.getElementById(f"alert-{block_id}")
    msg = box.querySelector(".msg-text")
    
    if total == 0:
        box.className = "alert-box alert-neutral"
        msg.innerHTML = "⚪ オーダーなし"
    elif total >= goal:
        box.className = "alert-box alert-success"
        msg.innerHTML = "✅ 条件クリア"
    else:
        box.className = "alert-box alert-danger"
        msg.innerHTML = f"⚠️ 不足: {goal - total:,}"
</script>
</body>
</html>
